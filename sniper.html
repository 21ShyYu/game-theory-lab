<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狙击对决 - 完美同步版</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; color: white; user-select: none; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; z-index: 10; }
        
        #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 40px; border-radius: 12px; text-align: center; pointer-events: auto; border: 1px solid #555; z-index: 100; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        
        input { padding: 12px; font-size: 18px; margin: 15px 0; width: 220px; text-align: center; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #d32f2f; color: white; border: none; border-radius: 4px; margin: 5px; transition: 0.2s; font-weight: bold; }
        button:hover { background: #b71c1c; }
        button:disabled { background: #444; cursor: not-allowed; opacity: 0.7; }
        
        .hud-text { font-size: 20px; text-shadow: 2px 2px 0px black; font-weight: bold; letter-spacing: 1px; }
        .top-bar { display: flex; justify-content: space-between; width: 100%; }
        
        #status-msg { color: #ffeb3b; font-weight: bold; font-size: 40px; text-align: center; position: absolute; top: 35%; width: 100%; text-shadow: 0 0 15px black; display: none; z-index: 20; pointer-events: none; }
        
        /* 姿势控制栏 */
        #defender-controls { display: none; pointer-events: auto; text-align: center; margin-bottom: 20px; }
        .pose-container { display: flex; justify-content: center; gap: 12px; }
        .pose-btn { background: #263238; border: 2px solid #546e7a; width: 75px; height: 85px; border-radius: 8px; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; transition: all 0.1s; color: #eceff1; }
        .pose-btn.active { background: #2e7d32; border-color: #66bb6a; transform: scale(1.1); z-index: 2; box-shadow: 0 0 10px rgba(76, 175, 80, 0.5); }
        .pose-btn:disabled { background: #1a1a1a; border-color: #333; color: #555; }
        .pose-icon { font-size: 26px; margin-bottom: 6px; }
        .key-hint { position: absolute; top: 4px; left: 6px; font-size: 10px; color: #90a4ae; font-weight: bold; }
        
        .cooldown-mask { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.6); height: 0%; transition: height 1s linear; border-radius: 0 0 6px 6px; }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="top-bar">
            <div id="p1-info" class="hud-text">等待连接...</div>
            <div id="phase-info" class="hud-text" style="color:#ffd700"></div>
            <div id="p2-info" class="hud-text"></div>
        </div>
        
        <div id="status-msg"></div>

        <div id="defender-controls">
            <div style="color: #bbb; margin-bottom: 8px; font-size: 14px; text-shadow: 1px 1px 0 #000;">
                ← AD 移动 | 数字键 1-4 切换姿势
            </div>
            <div class="pose-container">
                <button class="pose-btn active" id="btn-stand" onclick="requestPose('stand')">
                    <span class="key-hint">1</span>
                    <span class="pose-icon">🧍</span>站立
                    <div class="cooldown-mask"></div>
                </button>
                <button class="pose-btn" id="btn-crouch" onclick="requestPose('crouch')">
                    <span class="key-hint">2</span>
                    <span class="pose-icon">🧘</span>蹲下
                    <div class="cooldown-mask"></div>
                </button>
                <button class="pose-btn" id="btn-lie" onclick="requestPose('lie')">
                    <span class="key-hint">3</span>
                    <span class="pose-icon">🛌</span>躺下
                    <div class="cooldown-mask"></div>
                </button>
                <button class="pose-btn" id="btn-fly" onclick="requestPose('fly')">
                    <span class="key-hint">4</span>
                    <span class="pose-icon">🎈</span>飞天
                    <div class="cooldown-mask"></div>
                </button>
            </div>
        </div>
    </div>

    <div id="menu">
        <h1 style="color:#e53935; margin:0 0 10px 0; font-style: italic;">SNIPER DUEL <span style="font-size:0.4em; color:#fff; font-style: normal;">SYNC FIX</span></h1>
        <p style="color:#aaa; font-size:14px; margin-bottom: 20px;">纯HTML5实现的P2P狙击博弈</p>
        <input type="text" id="room-id" placeholder="输入房间号 (如: 888)" value="888">
        <br>
        <button id="btn-create" onclick="initNetwork('host')">创建房间 (先手狙击)</button>
        <button id="btn-join" onclick="initNetwork('client')">加入房间 (后手躲避)</button>
        <p id="conn-status" style="font-size: 13px; color: #888; margin-top:15px;">等待操作...</p>
    </div>

<script>
// --- 游戏配置 ---
const CFG = {
    moveSpeed: 0.18,
    zoomLevel: 2.5,  // 放大倍数
    scopeRadius: 300,
    coverHoleSize: 40,
    cooldownTime: 1000 // 姿势切换冷却
};

// --- 全局状态 ---
const STATE = {
    // 网络相关
    netRole: null, // 'host' (房主) 或 'client'
    conn: null,
    peer: null,
    
    // 游戏核心
    currentSniper: 'host', // 当前谁是狙击手
    phase: 'menu',         // menu, waiting(黑屏), aiming(开镜), result(结算)
    bullets: 3,
    
    // 玩家数据
    defenderPos: 50,    // 0-100
    defenderPose: 'stand',
    
    // 狙击手数据
    aimX: 0.5,
    aimY: 0.5,
    
    // 姿势冷却时间戳
    cooldowns: { stand: 0, crouch: 0, lie: 0, fly: 0 },
    
    // 双掩体系统 (离屏Canvas)
    covers: {
        host: null,   // Host做守方时的掩体
        client: null, // Client做守方时的掩体
        ctxHost: null,
        ctxClient: null
    },
    
    isGameRunning: false // 逻辑锁
};

// --- Canvas 初始化 ---
const CANVAS = document.getElementById('gameCanvas');
const CTX = CANVAS.getContext('2d');
let W, H;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    CANVAS.width = W;
    CANVAS.height = H;
    if(!STATE.covers.host) initCovers();
}
window.addEventListener('resize', resize);

// 初始化双掩体
function initCovers() {
    ['host', 'client'].forEach(key => {
        const c = document.createElement('canvas');
        c.width = window.innerWidth; 
        c.height = window.innerHeight;
        const ctx = c.getContext('2d');
        
        // 绘制墙体
        ctx.fillStyle = '#4e342e';
        const w = c.width, h = c.height;
        
        // 两个掩体块
        ctx.fillRect(w * 0.15, h * 0.65, w * 0.18, h * 0.35);
        ctx.fillRect(w * 0.60, h * 0.60, w * 0.20, h * 0.40);
        
        // 边框和纹理
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 6;
        ctx.strokeRect(w * 0.15, h * 0.65, w * 0.18, h * 0.35);
        ctx.strokeRect(w * 0.60, h * 0.60, w * 0.20, h * 0.40);
        
        // 标记区域
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.font = "bold 40px Arial";
        ctx.textAlign = "center";
        ctx.fillText(key === 'host' ? "ZONE A" : "ZONE B", w * 0.24, h * 0.8);
        
        STATE.covers[key] = c;
        STATE.covers['ctx' + key.charAt(0).toUpperCase() + key.slice(1)] = ctx;
    });
}
resize();

// --- 网络连接模块 ---
function log(msg) { document.getElementById('conn-status').innerText = msg; }

function initNetwork(role) {
    const room = document.getElementById('room-id').value;
    if(!room) return alert("请输入房间号");
    
    STATE.netRole = role;
    STATE.currentSniper = 'host';
    
    document.getElementById('btn-create').disabled = true;
    document.getElementById('btn-join').disabled = true;
    log("正在连接云端...");

    // 生成唯一的PeerID
    const myId = role === 'host' ? `sd_v3_${room}_h` : `sd_v3_${room}_c`;
    const targetId = role === 'host' ? `sd_v3_${room}_c` : `sd_v3_${room}_h`;
    
    if(STATE.peer) STATE.peer.destroy();
    STATE.peer = new Peer(myId);

    STATE.peer.on('open', (id) => {
        if(role === 'host') {
            log("房间已建立，等待对手...");
            STATE.peer.on('connection', (conn) => setupConn(conn));
        } else {
            log("正在搜索房间...");
            const conn = STATE.peer.connect(targetId);
            setupConn(conn);
        }
    });
    
    STATE.peer.on('error', (err) => {
        alert("连接失败: " + err.type + "\n请尝试更换房间号或刷新");
        location.reload();
    });
}

function setupConn(conn) {
    STATE.conn = conn;
    conn.on('open', () => {
        log("连接成功!");
        document.getElementById('menu').style.display = 'none';
        
        // 只有Host有权开始游戏循环
        if(STATE.netRole === 'host') {
            hostStartRound();
        }
    });
    conn.on('data', (data) => handleData(data));
    conn.on('close', () => { alert("连接断开"); location.reload(); });
}

function send(data) {
    if(STATE.conn && STATE.conn.open) STATE.conn.send(data);
}

// --- 游戏流程控制 (Host 权威模式) ---

// Host启动新回合
function hostStartRound() {
    // 重置数据
    const initialState = {
        phase: 'waiting',
        bullets: 3,
        defenderPos: 50,
        defenderPose: 'stand',
        msg: "准备阶段... 5"
    };
    
    // 广播初始状态
    send({ type: 'ROUND_START', state: initialState });
    applyRoundStart(initialState);
    
    // Host 运行倒计时
    let count = 5;
    const timer = setInterval(() => {
        count--;
        if(count > 0) {
            const msg = `准备阶段... ${count}`;
            showStatus(msg); // 本地显示
            send({ type: 'STATUS_MSG', msg: msg }); // 广播显示
        } else {
            clearInterval(timer);
            // 时间到，进入瞄准
            const aimingState = { phase: 'aiming', msg: "开火!" };
            send({ type: 'PHASE_CHANGE', state: aimingState });
            applyPhaseChange(aimingState);
        }
    }, 1000);
}

// 通用的应用状态函数
function applyRoundStart(data) {
    STATE.phase = data.phase;
    STATE.bullets = data.bullets;
    STATE.defenderPos = data.defenderPos;
    STATE.defenderPose = data.defenderPose;
    STATE.isGameRunning = true;
    STATE.cooldowns = { stand: 0, crouch: 0, lie: 0, fly: 0 }; // 重置冷却
    
    showStatus(data.msg);
    updateUI();
}

function applyPhaseChange(data) {
    STATE.phase = data.phase;
    showStatus(data.msg);
    setTimeout(() => showStatus(""), 1000); // 1秒后隐藏"开火"提示
    updateUI();
}

// 攻守交换逻辑
function triggerSwap(reasonMsg) {
    STATE.isGameRunning = false; // 锁定输入
    showStatus(reasonMsg); // 显示结果
    
    // 如果是Host，负责安排下一轮
    if(STATE.netRole === 'host') {
        setTimeout(() => {
            STATE.currentSniper = (STATE.currentSniper === 'host') ? 'client' : 'host';
            // 通知所有人换角色了
            send({ type: 'ROLE_SWAP', currentSniper: STATE.currentSniper });
            // 开始新一轮
            hostStartRound();
        }, 3000);
    }
}

// --- 交互与网络消息处理 ---

function handleData(data) {
    switch(data.type) {
        case 'ROUND_START': applyRoundStart(data.state); break;
        case 'STATUS_MSG': showStatus(data.msg); break;
        case 'PHASE_CHANGE': applyPhaseChange(data.state); break;
        case 'ROLE_SWAP': STATE.currentSniper = data.currentSniper; break;
        
        case 'AIM': // 守方收到瞄准坐标
            if(!isMyTurn()) { STATE.aimX = data.x; STATE.aimY = data.y; } 
            break;
            
        case 'MOVE': // 狙击手收到移动数据
            if(isMyTurn()) { STATE.defenderPos = data.pos; STATE.defenderPose = data.pose; } 
            break;
            
        case 'SHOT_RESULT': // 接收射击结果 (权威)
            processShotResult(data);
            break;
    }
}

function isMyTurn() {
    return STATE.netRole === STATE.currentSniper;
}

// 姿势切换请求
window.requestPose = function(newPose) {
    if(!STATE.isGameRunning || isMyTurn()) return;
    if(STATE.defenderPose === newPose) return;
    
    const now = Date.now();
    if(now < STATE.cooldowns[newPose]) return; // 冷却中
    
    // 设置旧姿势冷却
    STATE.cooldowns[STATE.defenderPose] = now + CFG.cooldownTime;
    
    STATE.defenderPose = newPose;
    updatePoseButtons();
    
    // 发送
    send({ type: 'MOVE', pos: STATE.defenderPos, pose: newPose });
}

// 键盘与鼠标
const keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if(!isMyTurn() && STATE.isGameRunning) {
        if(e.key === '1') requestPose('stand');
        if(e.key === '2') requestPose('crouch');
        if(e.key === '3') requestPose('lie');
        if(e.key === '4') requestPose('fly');
    }
});
window.addEventListener('keyup', (e) => keys[e.code] = false);

// 守方移动循环
function updateDefenderMove() {
    if(!STATE.isGameRunning || isMyTurn()) return;
    
    // 守方在waiting阶段也能移动！
    let move = 0;
    if(keys['KeyA'] || keys['ArrowLeft']) move = -1;
    if(keys['KeyD'] || keys['ArrowRight']) move = 1;
    
    if(move !== 0) {
        STATE.defenderPos += move * CFG.moveSpeed;
        STATE.defenderPos = Math.max(0, Math.min(100, STATE.defenderPos));
        send({ type: 'MOVE', pos: STATE.defenderPos, pose: STATE.defenderPose });
    }
}

// 狙击瞄准与射击
window.addEventListener('mousemove', (e) => {
    if(!isMyTurn() || STATE.phase !== 'aiming' || !STATE.isGameRunning) return;
    STATE.aimX = e.clientX / W;
    STATE.aimY = e.clientY / H;
    send({ type: 'AIM', x: STATE.aimX, y: STATE.aimY });
});

window.addEventListener('mousedown', (e) => {
    if(!isMyTurn() || STATE.phase !== 'aiming' || !STATE.isGameRunning) return;
    if(STATE.bullets <= 0) return;

    // 1. 狙击手本地计算命中 (权威)
    const hitRes = checkHit(STATE.aimX, STATE.aimY);
    const newBullets = STATE.bullets - 1;
    
    const resultData = {
        type: 'SHOT_RESULT',
        x: STATE.aimX,
        y: STATE.aimY,
        hit: hitRes, // null 或 '头部'/'身体'
        bullets: newBullets
    };
    
    // 2. 发送结果给守方
    send(resultData);
    
    // 3. 本地执行结果
    processShotResult(resultData);
});

// 处理射击结果 (双方通用)
function processShotResult(data) {
    STATE.bullets = data.bullets;
    updateUI();

    // 1. 挖洞 (根据当前的守方是谁，挖对应的掩体)
    const defenderRole = STATE.currentSniper === 'host' ? 'client' : 'host';
    const ctx = defenderRole === 'host' ? STATE.covers.ctxHost : STATE.covers.ctxClient;
    
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(data.x * W, data.y * H, CFG.coverHoleSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    
    // 2. 判断胜负
    if(data.hit) {
        // 命中，攻方胜
        triggerSwap(`命中 ${data.hit}! 攻方胜利!`);
    } else {
        // 未命中
        if(STATE.bullets <= 0) {
            triggerSwap("子弹耗尽! 守方胜利!");
        } else {
            // 只是普通未命中，显示提示
            showStatus("未命中!");
            setTimeout(() => showStatus(""), 500);
        }
    }
}

// 命中判定算法
function checkHit(sx, sy) {
    const bones = getBones(STATE.defenderPose, (STATE.defenderPos/100)*W, H*0.75);
    const aimX = sx * W;
    const aimY = sy * H;
    
    for(let part in bones) {
        if(part === 'string') continue; // 绳子不算
        const b = bones[part];
        if(aimX >= b.x - b.w/2 && aimX <= b.x + b.w/2 &&
           aimY >= b.y - b.h/2 && aimY <= b.y + b.h/2) {
            return part === 'head' ? '头部' : '身体';
        }
    }
    return null;
}


// --- 渲染系统 ---

function draw() {
    CTX.fillStyle = '#111';
    CTX.fillRect(0, 0, W, H);
    
    // 地面
    CTX.fillStyle = '#263238';
    CTX.fillRect(0, H * 0.75, W, H * 0.25);
    CTX.strokeStyle = '#37474f';
    CTX.beginPath(); CTX.moveTo(0, H * 0.75); CTX.lineTo(W, H * 0.75); CTX.stroke();

    const isSniper = isMyTurn();
    const defenderRole = STATE.currentSniper === 'host' ? 'client' : 'host';
    const activeCover = defenderRole === 'host' ? STATE.covers.host : STATE.covers.client;

    if(isSniper) {
        // --- 狙击视角 ---
        
        // 准备阶段：黑屏 + 文字
        if(STATE.phase === 'waiting') {
            CTX.fillStyle = 'black';
            CTX.fillRect(0, 0, W, H);
            return; 
        }

        CTX.save();
        // 放大效果
        CTX.translate(W * STATE.aimX, H * STATE.aimY);
        CTX.scale(CFG.zoomLevel, CFG.zoomLevel);
        CTX.translate(-W * STATE.aimX, -H * STATE.aimY);

        // 顺序：人 -> 掩体 (人被遮挡)
        drawDefender();
        if(activeCover) CTX.drawImage(activeCover, 0, 0);

        CTX.restore();
        
        // 狙击镜遮罩 (纯深灰，不透明)
        drawScopeMask();

    } else {
        // --- 守方视角 ---
        
        // 顺序：掩体 -> 人 (透视)
        if(activeCover) CTX.drawImage(activeCover, 0, 0);
        
        // 高亮显示自己
        drawDefender(true);
        
        // 只有在Aiming阶段才显示激光
        if(STATE.phase === 'aiming') {
            drawLaser();
        }
    }
}

function drawScopeMask() {
    const mx = W * STATE.aimX;
    const my = H * STATE.aimY;
    const r = CFG.scopeRadius;
    
    // 纯色填充外部
    CTX.fillStyle = '#212121'; 
    CTX.beginPath();
    CTX.rect(0, 0, W, H);
    CTX.arc(mx, my, r, 0, Math.PI*2, true); 
    CTX.fill();
    
    // 准星
    CTX.strokeStyle = 'rgba(0,0,0,0.8)';
    CTX.lineWidth = 1;
    CTX.beginPath();
    CTX.moveTo(mx - r, my); CTX.lineTo(mx + r, my);
    CTX.moveTo(mx, my - r); CTX.lineTo(mx, my + r);
    CTX.stroke();
    
    CTX.fillStyle = '#d50000';
    CTX.beginPath(); CTX.arc(mx, my, 2, 0, Math.PI*2); CTX.fill();
}

function drawLaser() {
    CTX.beginPath();
    CTX.strokeStyle = 'rgba(255, 0, 0, 0.6)';
    CTX.lineWidth = 2;
    CTX.moveTo(W/2, 0);
    CTX.lineTo(W * STATE.aimX, H * STATE.aimY);
    CTX.stroke();
    
    CTX.fillStyle = 'red';
    CTX.beginPath(); CTX.arc(W * STATE.aimX, H * STATE.aimY, 5, 0, Math.PI*2); CTX.fill();
}

// 骨骼定义
function getBones(pose, cx, cy) {
    let head = { x: cx, y: cy - 90, w: 30, h: 30 };
    let body = { x: cx, y: cy - 50, w: 40, h: 60 };
    let leg  = { x: cx, y: cy - 10, w: 30, h: 40 };
    let string = null;

    if(pose === 'crouch') {
        head.y = cy - 50;
        body.y = cy - 25; body.h = 30;
        leg.y = cy - 5; leg.h = 10;
    } else if(pose === 'lie') {
        head = { x: cx - 40, y: cy - 8, w: 30, h: 16 };
        body = { x: cx, y: cy - 8, w: 60, h: 16 };
        leg  = { x: cx + 40, y: cy - 8, w: 30, h: 16 };
    } else if(pose === 'fly') {
        const flyH = 220;
        head.y -= flyH;
        body.y -= flyH; body.w = 32; body.h = 32; // 蜷缩成球
        leg.w = 0; leg.h = 0; 
        string = { x1: cx, y1: cy, x2: cx, y2: body.y + 16 };
    }
    return { head, body, leg, string };
}

function drawDefender(highlight = false) {
    const cx = (STATE.defenderPos / 100) * W;
    const cy = H * 0.75;
    const bones = getBones(STATE.defenderPose, cx, cy);
    
    CTX.lineWidth = 2;
    CTX.strokeStyle = '#1b5e20';

    if(bones.string) {
        CTX.strokeStyle = '#fff';
        CTX.beginPath(); CTX.moveTo(bones.string.x1, bones.string.y1); CTX.lineTo(bones.string.x2, bones.string.y2); CTX.stroke();
    }
    
    const colors = highlight 
        ? { head: '#a5d6a7', body: '#66bb6a', leg: '#81c784' } 
        : { head: '#81c784', body: '#43a047', leg: '#2e7d32' };

    ['leg', 'body', 'head'].forEach(part => {
        const b = bones[part];
        if(!b || b.w <= 0) return;
        CTX.fillStyle = colors[part];
        CTX.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
        CTX.strokeRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
        
        // 眼睛
        if(part === 'head') {
            CTX.fillStyle = '#263238';
            CTX.fillRect(b.x - 8, b.y - 4, 16, 4);
        }
    });
}

// UI更新
function updateUI() {
    const isSniper = isMyTurn();
    document.getElementById('defender-controls').style.display = (!isSniper && STATE.phase !== 'menu') ? 'block' : 'none';
    
    document.getElementById('p1-info').innerText = isSniper ? `狙击手 (你) | 子弹: ${STATE.bullets}` : `伪装者 (你)`;
    document.getElementById('p2-info').innerText = isSniper ? "目标: 伪装者" : "威胁: 狙击手";
    
    let phaseText = "";
    if(STATE.phase === 'waiting') phaseText = "准备阶段";
    else if(STATE.phase === 'aiming') phaseText = "交战中";
    else if(STATE.phase === 'menu') phaseText = "";
    document.getElementById('phase-info').innerText = phaseText;
    
    if(!isSniper) updatePoseButtons();
}

function updatePoseButtons() {
    const now = Date.now();
    ['stand', 'crouch', 'lie', 'fly'].forEach(pose => {
        const btn = document.getElementById('btn-' + pose);
        if(STATE.defenderPose === pose) {
            btn.classList.add('active');
            btn.disabled = false;
        } else {
            btn.classList.remove('active');
            if(now < STATE.cooldowns[pose]) {
                btn.disabled = true;
            } else {
                btn.disabled = false;
            }
        }
    });
}

function showStatus(msg) {
    const el = document.getElementById('status-msg');
    el.innerText = msg;
    el.style.display = msg ? 'block' : 'none';
}

function loop() {
    updateDefenderMove();
    draw();
    requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
