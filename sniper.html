<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狙击对决 - 终极版</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; color: white; user-select: none; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; z-index: 10; }
        
        #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 40px; border-radius: 12px; text-align: center; pointer-events: auto; border: 1px solid #444; z-index: 100; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        input { padding: 12px; font-size: 18px; margin: 15px 0; width: 220px; text-align: center; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #e53935; color: white; border: none; border-radius: 4px; margin: 5px; transition: 0.2s; }
        button:hover { background: #c62828; }
        button:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        
        .hud-text { font-size: 20px; text-shadow: 1px 1px 2px black; font-weight: bold; }
        .top-bar { display: flex; justify-content: space-between; width: 100%; }
        
        #status-msg { color: #ffeb3b; font-weight: bold; font-size: 32px; text-align: center; position: absolute; top: 30%; width: 100%; text-shadow: 0 0 10px black; display: none; }
        
        /* 姿势控制栏 */
        #defender-controls { display: none; pointer-events: auto; text-align: center; margin-bottom: 20px; }
        .pose-container { display: flex; justify-content: center; gap: 10px; }
        .pose-btn { background: #333; border: 2px solid #666; width: 70px; height: 80px; border-radius: 10px; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; transition: all 0.1s; }
        .pose-btn.active { background: #2e7d32; border-color: #4caf50; transform: scale(1.1); z-index: 2; }
        .pose-btn:disabled { background: #222; border-color: #444; color: #666; cursor: not-allowed; }
        .pose-icon { font-size: 24px; margin-bottom: 5px; }
        .key-hint { position: absolute; top: 2px; left: 5px; font-size: 10px; color: #aaa; }
        
        /* 冷却遮罩 */
        .cooldown-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.5); height: 0%; transition: height 1s linear; }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="top-bar">
            <div id="p1-info" class="hud-text">等待中...</div>
            <div id="game-timer" class="hud-text" style="color:#aaa"></div>
            <div id="p2-info" class="hud-text"></div>
        </div>
        
        <div id="status-msg"></div>

        <div id="defender-controls">
            <div style="color: #ddd; margin-bottom: 10px; font-size: 14px; text-shadow: 1px 1px 0 #000;">
                ← AD 移动 | 数字键 1-4 切换姿势
            </div>
            <div class="pose-container">
                <button class="pose-btn active" id="btn-stand" onclick="trySetPose('stand')">
                    <span class="key-hint">1</span>
                    <span class="pose-icon">🧍</span>站立
                    <div class="cooldown-overlay"></div>
                </button>
                <button class="pose-btn" id="btn-crouch" onclick="trySetPose('crouch')">
                    <span class="key-hint">2</span>
                    <span class="pose-icon">🧘</span>蹲下
                    <div class="cooldown-overlay"></div>
                </button>
                <button class="pose-btn" id="btn-lie" onclick="trySetPose('lie')">
                    <span class="key-hint">3</span>
                    <span class="pose-icon">🛌</span>躺下
                    <div class="cooldown-overlay"></div>
                </button>
                <button class="pose-btn" id="btn-fly" onclick="trySetPose('fly')">
                    <span class="key-hint">4</span>
                    <span class="pose-icon">🎈</span>飞天
                    <div class="cooldown-overlay"></div>
                </button>
            </div>
        </div>
    </div>

    <div id="menu">
        <h1 style="color:#e53935; margin:0 0 10px 0;">狙击对决 <span style="font-size:0.5em; color:#fff">v3.0</span></h1>
        <p style="color:#aaa; font-size:14px;">狙击 vs 伪装。命中即结束回合。</p>
        <input type="text" id="room-id" placeholder="输入房间号 (如: 888)" value="888">
        <br>
        <button id="btn-create" onclick="initNetwork('host')">创建房间 (先手狙击)</button>
        <button id="btn-join" onclick="initNetwork('client')">加入房间 (后手躲避)</button>
        <p id="conn-status" style="font-size: 12px; color: #888; margin-top:15px;"></p>
    </div>

<script>
// --- 全局配置 ---
const CFG = {
    moveSpeed: 0.15,
    zoomLevel: 2.2, 
    scopeRadius: 280,
    bulletDmg: 100, // 只要命中就结束，所以伤害其实不重要了，只要大于0
    coverHoleSize: 35,
    cooldownTime: 1000 // ms
};

// --- 游戏状态 ---
const STATE = {
    netRole: null, // 'host' or 'client'
    conn: null,
    peer: null,
    currentSniper: 'host', 
    
    phase: 'menu', // menu, waiting, aiming, result
    bullets: 3,
    
    // 玩家数据
    defenderPos: 50,
    defenderPose: 'stand',
    
    // 狙击手数据
    aimX: 0.5,
    aimY: 0.5,
    
    // 姿势冷却 { poseName: timestamp }
    cooldowns: { stand: 0, crouch: 0, lie: 0, fly: 0 },
    
    // 掩体 (双通道)
    covers: {
        host: null,   // Host当守方时的掩体
        client: null, // Client当守方时的掩体
        ctxHost: null,
        ctxClient: null
    },
    
    gameOver: false // 回合锁
};

// --- Canvas 初始化 ---
const CANVAS = document.getElementById('gameCanvas');
const CTX = CANVAS.getContext('2d');
let W, H;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    CANVAS.width = W;
    CANVAS.height = H;
    // 如果还没初始化掩体，初始化之
    if(!STATE.covers.host) initCovers();
}
window.addEventListener('resize', resize);

function initCovers() {
    // 创建两个独立的离屏Canvas
    ['host', 'client'].forEach(key => {
        const c = document.createElement('canvas');
        c.width = window.innerWidth; // 暂时用当前宽度，生产环境应处理resize保留内容
        c.height = window.innerHeight;
        const ctx = c.getContext('2d');
        
        // 绘制掩体 (两个人的掩体布局可以略有不同，或者一样但状态独立)
        drawInitialCover(ctx, key === 'host');
        
        STATE.covers[key] = c;
        STATE.covers['ctx' + key.charAt(0).toUpperCase() + key.slice(1)] = ctx;
    });
}

function drawInitialCover(ctx, isHost) {
    ctx.fillStyle = '#5d4037';
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    
    // 布局
    // 左掩体
    ctx.fillRect(w * 0.15, h * 0.65, w * 0.18, h * 0.35);
    // 右掩体
    ctx.fillRect(w * 0.60, h * 0.60, w * 0.20, h * 0.40);
    
    // 边框
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 5;
    ctx.strokeRect(w * 0.15, h * 0.65, w * 0.18, h * 0.35);
    ctx.strokeRect(w * 0.60, h * 0.60, w * 0.20, h * 0.40);
    
    // 装饰
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.font = "30px Arial";
    ctx.fillText(isHost ? "A区" : "B区", w * 0.2, h * 0.8);
}

resize();

// --- 网络模块 ---
function log(msg) { document.getElementById('conn-status').innerText = msg; }

function initNetwork(role) {
    const room = document.getElementById('room-id').value;
    if(!room) return alert("请输入房间号");
    
    STATE.netRole = role;
    STATE.currentSniper = 'host';
    
    document.getElementById('btn-create').disabled = true;
    document.getElementById('btn-join').disabled = true;
    log("连接服务器...");

    const myId = role === 'host' ? `sg_${room}_h` : `sg_${room}_c`;
    const targetId = role === 'host' ? `sg_${room}_c` : `sg_${room}_h`;
    
    if(STATE.peer) STATE.peer.destroy();
    STATE.peer = new Peer(myId);

    STATE.peer.on('open', (id) => {
        if(role === 'host') {
            log("等待对手...");
            STATE.peer.on('connection', (conn) => setupConnection(conn));
        } else {
            log("寻找房间...");
            const conn = STATE.peer.connect(targetId);
            setupConnection(conn);
        }
    });

    STATE.peer.on('error', (err) => {
        alert("连接失败: " + err.type);
        location.reload();
    });
}

function setupConnection(conn) {
    STATE.conn = conn;
    conn.on('open', () => {
        document.getElementById('menu').style.display = 'none';
        startGame();
    });
    conn.on('data', (data) => handleData(data));
    conn.on('close', () => location.reload());
}

function send(data) {
    if(STATE.conn && STATE.conn.open) STATE.conn.send(data);
}

// --- 游戏逻辑 ---

function startGame() {
    startRound();
}

function startRound() {
    STATE.phase = 'waiting';
    STATE.bullets = 3;
    STATE.defenderPos = 50;
    STATE.defenderPose = 'stand';
    STATE.gameOver = false;
    
    // 重置冷却
    STATE.cooldowns = { stand: 0, crouch: 0, lie: 0, fly: 0 };
    updatePoseButtons();

    updateUI();
    
    // 5秒准备倒计时
    let count = 5;
    const isSniper = isMyTurn();
    
    const msg = isSniper ? `搜索目标... ${count}` : `快躲起来! ${count}`;
    showStatus(msg);

    const timer = setInterval(() => {
        count--;
        if(count > 0) {
            const m = isSniper ? `搜索目标... ${count}` : `快躲起来! ${count}`;
            showStatus(m);
        } else {
            clearInterval(timer);
            STATE.phase = 'aiming';
            if(isSniper) {
                showStatus("自由开火!");
            } else {
                showStatus("注意隐蔽!");
            }
        }
    }, 1000);
}

function isMyTurn() {
    return STATE.netRole === STATE.currentSniper;
}

// 攻守交换
function swapRoles(reason) {
    STATE.gameOver = true;
    showStatus(reason);
    
    setTimeout(() => {
        STATE.currentSniper = (STATE.currentSniper === 'host') ? 'client' : 'host';
        startRound();
    }, 3000);
}

// --- 输入处理 ---

// 鼠标移动
window.addEventListener('mousemove', (e) => {
    if(STATE.phase !== 'aiming' || STATE.gameOver) return;
    if(isMyTurn()) {
        STATE.aimX = e.clientX / W;
        STATE.aimY = e.clientY / H;
        send({ type: 'AIM', x: STATE.aimX, y: STATE.aimY });
    }
});

// 开枪
window.addEventListener('mousedown', (e) => {
    if(STATE.phase !== 'aiming' || STATE.gameOver) return;
    if(isMyTurn() && STATE.bullets > 0) {
        send({ type: 'SHOOT', x: STATE.aimX, y: STATE.aimY });
        handleShoot(STATE.aimX, STATE.aimY);
    }
});

// 键盘移动与快捷键
const keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    
    // 快捷键切换姿势
    if(!isMyTurn() && !STATE.gameOver) {
        if(e.key === '1') trySetPose('stand');
        if(e.key === '2') trySetPose('crouch');
        if(e.key === '3') trySetPose('lie');
        if(e.key === '4') trySetPose('fly');
    }
});
window.addEventListener('keyup', (e) => keys[e.code] = false);

function updateDefender() {
    // 守方在前5秒也可以移动！
    if(STATE.phase === 'menu' || STATE.gameOver) return;
    
    if(!isMyTurn()) {
        let move = 0;
        if(keys['KeyA'] || keys['ArrowLeft']) move = -1;
        if(keys['KeyD'] || keys['ArrowRight']) move = 1;
        
        if(move !== 0) {
            STATE.defenderPos += move * CFG.moveSpeed;
            STATE.defenderPos = Math.max(0, Math.min(100, STATE.defenderPos));
            send({ type: 'MOVE', pos: STATE.defenderPos, pose: STATE.defenderPose });
        }
    }
}

// 姿势切换逻辑 (含冷却)
window.trySetPose = function(newPose) {
    if(STATE.gameOver || isMyTurn()) return;
    if(STATE.defenderPose === newPose) return; // 已经是这个姿势
    
    const now = Date.now();
    // 检查目标姿势是否在冷却
    if(now < STATE.cooldowns[newPose]) return; 
    
    // 切换成功
    // 旧姿势进入冷却
    STATE.cooldowns[STATE.defenderPose] = now + CFG.cooldownTime;
    STATE.defenderPose = newPose;
    
    updatePoseButtons();
    send({ type: 'MOVE', pos: STATE.defenderPos, pose: newPose });
}

function updatePoseButtons() {
    const now = Date.now();
    ['stand', 'crouch', 'lie', 'fly'].forEach(pose => {
        const btn = document.getElementById('btn-' + pose);
        const cd = STATE.cooldowns[pose];
        
        // 激活状态
        if(STATE.defenderPose === pose) {
            btn.classList.add('active');
            btn.disabled = false;
        } else {
            btn.classList.remove('active');
            // 冷却状态
            if(now < cd) {
                btn.disabled = true;
                // 简单的冷却视觉效果 (略)
            } else {
                btn.disabled = false;
            }
        }
    });
}

// --- 数据处理 ---
function handleData(data) {
    switch(data.type) {
        case 'AIM': if(!isMyTurn()) { STATE.aimX = data.x; STATE.aimY = data.y; } break;
        case 'MOVE': if(isMyTurn()) { STATE.defenderPos = data.pos; STATE.defenderPose = data.pose; } break;
        case 'SHOOT': handleShoot(data.x, data.y); break;
    }
}

// --- 射击判定 ---
function handleShoot(x, y) {
    if(STATE.gameOver) return;

    STATE.bullets--;
    updateUI();

    // 1. 破坏掩体 (根据当前谁是守方，破坏对应的Canvas)
    // 守方是 currentSniper === 'host' ? client : host
    const defenderRole = STATE.currentSniper === 'host' ? 'client' : 'host';
    const ctx = defenderRole === 'host' ? STATE.covers.ctxHost : STATE.covers.ctxClient;
    
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x * W, y * H, CFG.coverHoleSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // 2. 命中判定
    // 只有当狙击手开镜(Phase=Aiming)时才有效判定
    if(STATE.phase === 'aiming') {
        const hit = checkHit(x, y);
        
        if(hit) {
            // 命中即结束
            swapRoles(`命中 ${hit}! 攻方胜利!`);
            return;
        }
    }

    // 未命中
    if(STATE.bullets <= 0) {
        swapRoles("子弹耗尽! 守方胜利!");
    } else {
        showStatus("未命中!");
    }
}

function checkHit(sx, sy) {
    const bones = getBones(STATE.defenderPose, (STATE.defenderPos/100)*W, H*0.75);
    const aimX = sx * W;
    const aimY = sy * H;
    
    // 简单矩形检测
    for(let part in bones) {
        const b = bones[part];
        if(aimX >= b.x - b.w/2 && aimX <= b.x + b.w/2 &&
           aimY >= b.y - b.h/2 && aimY <= b.y + b.h/2) {
            return part === 'head' ? '头部' : '身体';
        }
    }
    return null;
}

// --- 渲染 ---
function draw() {
    // 背景
    CTX.fillStyle = '#111';
    CTX.fillRect(0, 0, W, H);
    
    // 地面
    CTX.fillStyle = '#222';
    CTX.fillRect(0, H * 0.75, W, H * 0.25);
    CTX.strokeStyle = '#444';
    CTX.beginPath();
    CTX.moveTo(0, H * 0.75); CTX.lineTo(W, H * 0.75);
    CTX.stroke();

    const isSniper = isMyTurn();
    const defenderRole = STATE.currentSniper === 'host' ? 'client' : 'host';
    const activeCover = defenderRole === 'host' ? STATE.covers.host : STATE.covers.client;

    // 视角处理
    if(isSniper) {
        // --- 狙击手视角 ---
        
        // 1. 等待阶段黑屏
        if(STATE.phase === 'waiting') {
            CTX.fillStyle = 'black';
            CTX.fillRect(0, 0, W, H);
            return; // 不渲染其他
        }

        CTX.save();
        
        // 放大效果 (Zoom)
        // 移动画布中心到 aimX, aimY，然后放大，再移回
        CTX.translate(W * STATE.aimX, H * STATE.aimY);
        CTX.scale(CFG.zoomLevel, CFG.zoomLevel);
        CTX.translate(-W * STATE.aimX, -H * STATE.aimY);

        // 渲染顺序：人物 -> 掩体 (掩体挡住人物)
        drawDefender();
        if(activeCover) CTX.drawImage(activeCover, 0, 0);
        
        // 激光点 (自己能看到准心，不需要画激光，但为了统一逻辑可以画个红点)
        
        CTX.restore();

        // 狙击镜遮罩 (不透明灰色)
        drawScopeMask();

    } else {
        // --- 守方视角 ---
        
        // 渲染顺序：掩体 -> 人物 (人物浮在掩体上，X光效果)
        // 为了让守方知道自己在哪里，我们先画掩体，再画半透明或高亮的人物
        
        if(activeCover) CTX.drawImage(activeCover, 0, 0);
        
        // 守方需要看到自己，所以最后画人物
        drawDefender(true); // true 表示高亮模式
        
        // 激光指示线 (只有Aiming阶段显示)
        if(STATE.phase === 'aiming') {
            drawLaser();
        }
    }
}

function drawScopeMask() {
    const mx = W * STATE.aimX;
    const my = H * STATE.aimY;
    const r = CFG.scopeRadius;
    
    // 填充纯灰色背景
    CTX.fillStyle = '#333'; 
    CTX.beginPath();
    CTX.rect(0, 0, W, H);
    CTX.arc(mx, my, r, 0, Math.PI*2, true); // 挖洞
    CTX.fill();
    
    // 镜内十字
    CTX.strokeStyle = 'rgba(0,0,0,0.8)';
    CTX.lineWidth = 1;
    CTX.beginPath();
    CTX.moveTo(mx - r, my); CTX.lineTo(mx + r, my);
    CTX.moveTo(mx, my - r); CTX.lineTo(mx, my + r);
    CTX.stroke();
    
    // 中心红点
    CTX.fillStyle = 'red';
    CTX.beginPath();
    CTX.arc(mx, my, 3, 0, Math.PI*2);
    CTX.fill();
}

function drawLaser() {
    CTX.beginPath();
    CTX.strokeStyle = 'rgba(255, 0, 0, 0.5)';
    CTX.lineWidth = 2;
    CTX.moveTo(W/2, 0); // 假设从正上方射下
    CTX.lineTo(W * STATE.aimX, H * STATE.aimY);
    CTX.stroke();
    
    CTX.fillStyle = 'red';
    CTX.beginPath();
    CTX.arc(W * STATE.aimX, H * STATE.aimY, 5, 0, Math.PI*2);
    CTX.fill();
}

// 骨骼生成与绘制
function getBones(pose, cx, cy) {
    // 基础尺寸
    let head = { x: cx, y: cy - 90, w: 30, h: 30 };
    let body = { x: cx, y: cy - 50, w: 40, h: 60 };
    let leg  = { x: cx, y: cy - 10, w: 30, h: 40 }; // 简化的腿
    let string = null;

    if(pose === 'crouch') {
        // 蹲下：矮一半
        head.y = cy - 50;
        body.y = cy - 25; body.h = 30;
        leg.y = cy - 5; leg.h = 10;
    }
    else if(pose === 'lie') {
        // 躺平：贴地，宽扁
        head = { x: cx - 40, y: cy - 10, w: 30, h: 20 };
        body = { x: cx, y: cy - 10, w: 60, h: 20 };
        leg  = { x: cx + 40, y: cy - 10, w: 30, h: 15 };
    }
    else if(pose === 'fly') {
        // 飞天：上移 200px
        const flyH = 200;
        head.y -= flyH;
        body.y -= flyH; body.w = 30; body.h = 30; // 蜷缩
        leg.y -= flyH; leg.w = 0; leg.h = 0; // 收腿
        string = { x1: cx, y1: cy, x2: cx, y2: body.y + 15 }; // 绳子
    }
    
    return { head, body, leg, string };
}

function drawDefender(highlight = false) {
    const cx = (STATE.defenderPos / 100) * W;
    const cy = H * 0.75;
    const bones = getBones(STATE.defenderPose, cx, cy);
    
    CTX.fillStyle = highlight ? '#81c784' : '#4caf50'; // 守方自己看更亮一点
    CTX.strokeStyle = '#1b5e20';
    CTX.lineWidth = 3;
    
    // 飞天绳子
    if(bones.string) {
        CTX.strokeStyle = 'white';
        CTX.lineWidth = 1;
        CTX.beginPath();
        CTX.moveTo(bones.string.x1, bones.string.y1);
        CTX.lineTo(bones.string.x2, bones.string.y2);
        CTX.stroke();
    }
    
    // 绘制各部位
    ['leg', 'body', 'head'].forEach(part => {
        const b = bones[part];
        if(!b || b.w === 0) return;
        
        CTX.fillStyle = (part === 'head') ? '#a5d6a7' : (highlight ? '#66bb6a' : '#2e7d32');
        
        CTX.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
        CTX.strokeRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
        
        // 简单的五官方向指示
        if(part === 'head') {
            CTX.fillStyle = '#111';
            // 永远看向屏幕外侧(简单处理)
            CTX.fillRect(b.x - 5, b.y - 5, 10, 4);
        }
    });
}

function updateUI() {
    const isSniper = isMyTurn();
    document.getElementById('defender-controls').style.display = (!isSniper && STATE.phase !== 'result') ? 'block' : 'none';
    
    document.getElementById('p1-info').innerText = isSniper ? `狙击手 | 子弹: ${STATE.bullets}` : `伪装者 | 躲避狙击`;
    document.getElementById('p2-info').innerText = STATE.phase === 'waiting' ? "准备阶段" : "交战中";
    
    // 刷新冷却按钮状态
    if(!isSniper) updatePoseButtons();
}

function loop() {
    updateDefender();
    draw();
    requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
