<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博弈实验室：丢手绢 (联机版)</title>
    <p style="text-align: center; color: #64748b; font-size: 0.9em; margin: 0 0 10px 0;">作者：iyushy</p>
    <!-- 引入 PeerJS 用于点对点联机 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #06b6d4;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --danger: #ef4444;
            --success: #10b981;
            --accent: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container { max-width: 800px; width: 95%; margin: 20px auto; }

        /* 菜单屏幕 */
        #menu-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 80vh; gap: 20px;
        }
        .menu-card {
            background: var(--card-bg); padding: 40px; border-radius: 20px;
            text-align: center; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%; max-width: 400px;
        }
        input.room-input {
            width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px;
            border: 1px solid #475569; background: #0f172a; color: white; font-size: 1.2em; text-align: center;
        }

        /* 游戏界面 (默认隐藏) */
        #game-screen { display: none; width: 100%; }
        
        /* 顶部血条区 */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 20px; border-radius: 15px;
            border: 1px solid #334155; margin-bottom: 20px;
        }

        .shield-badge {
            background: var(--accent); color: black; padding: 2px 8px; border-radius: 10px;
            font-size: 0.8em; font-weight: bold; margin-left: 5px;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
            animation: pulse 2s infinite; display: none;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .player-info { text-align: center; width: 40%; }
        .role-badge { 
            display: inline-block; padding: 4px 8px; border-radius: 4px; 
            font-size: 0.8em; margin-bottom: 5px; font-weight: bold;
        }
        .role-atk { background: var(--secondary); color: black; }
        .role-def { background: var(--primary); color: white; }

        .hp-bar-container {
            height: 20px; background: #0f172a; border-radius: 10px; overflow: hidden;
            margin-top: 5px; position: relative; border: 1px solid #334155;
        }
        .hp-bar { height: 100%; transition: width 0.5s ease; }
        .hp-text { position: absolute; width: 100%; text-align: center; font-size: 0.8em; line-height: 20px; top: 0; text-shadow: 1px 1px 2px black; z-index: 2; }

        /* 中间博弈区 */
        .game-arena {
            background: var(--card-bg); padding: 20px; border-radius: 15px;
            min-height: 400px; display: flex; flex-direction: column; align-items: center; position: relative;
        }

        /* 时间轴 */
        .timeline { display: flex; gap: 8px; margin: 30px 0; flex-wrap: wrap; justify-content: center; }
        .time-slot {
            width: 30px; height: 30px; border-radius: 50%; background: #334155;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.8em; color: #94a3b8; transition: 0.3s; position: relative;
        }
        .time-slot.active { background: var(--text); color: var(--bg); box-shadow: 0 0 10px white; transform: scale(1.2); z-index: 10; }
        .time-slot.past { background: #475569; }
        /* 仅对攻方显示手绢位置 */
        .time-slot.has-item::after { content: '🧣'; font-size: 1.2em; position: absolute; top: -25px; }

        /* 结果显示区 */
        .result-display {
            width: 100%; flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-bottom: 20px;
        }
        .result-img {
            max-width: 300px; max-height: 200px; border-radius: 10px;
            border: 2px solid var(--text); display: none; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .result-text { margin-top: 15px; font-size: 1.2em; text-align: center; min-height: 3em; }

        /* 按钮 */
        .controls { display: flex; gap: 20px; margin-top: auto; justify-content: center; width: 100%; }
        .btn {
            padding: 15px 30px; border: none; border-radius: 8px; font-size: 1.1em;
            font-weight: bold; cursor: pointer; transition: 0.2s; color: white; min-width: 140px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        .btn-act { background: var(--secondary); box-shadow: 0 4px 0 #0891b2; }
        .btn-act:active { transform: translateY(4px); box-shadow: none; }
        .btn-wait { background: #475569; box-shadow: 0 4px 0 #334155; }
        .btn-wait:active { transform: translateY(4px); box-shadow: none; }
        .btn-danger { background: var(--danger); box-shadow: 0 4px 0 #b91c1c; }
        
        .fade-in { animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* 模态框 */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center;
            z-index: 100; display: none;
        }
        .modal-content {
            background: var(--card-bg); padding: 40px; border-radius: 15px; 
            text-align: center; border: 2px solid var(--primary); max-width: 90%;
        }

        /* 联机状态提示 */
        #net-status {
            position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
            padding: 5px 10px; border-radius: 5px; font-size: 0.8em; color: #aaa; z-index: 99;
        }
    </style>
</head>
<body>

<div id="net-status">状态: 离线</div>

<!-- 菜单界面 -->
<div id="menu-screen">
    <h1 style="color:var(--primary); text-shadow: 0 0 10px var(--primary);">博弈实验室：丢手绢</h1>
    
    <div class="menu-card">
        <h3>单人模式</h3>
        <p style="color:#94a3b8; font-size:0.9em;">挑战 AI 逻辑</p>
        <button class="btn btn-wait" onclick="startGame('pve')">开始单机</button>
    </div>

    <div class="menu-card" style="border-color: var(--secondary);">
        <h3>联机对战 (P2P)</h3>
        <p style="color:#94a3b8; font-size:0.9em;">输入相同的房间号 (如: 1234)</p>
        <input type="text" id="room-code" class="room-input" placeholder="输入房间号" maxlength="10">
        <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
            <button class="btn btn-act" style="min-width:100px; font-size:1em;" onclick="initNetwork('host')">我是房主</button>
            <button class="btn btn-act" style="min-width:100px; font-size:1em; background:var(--primary); box-shadow:0 4px 0 #7c3aed;" onclick="initNetwork('join')">加入房间</button>
        </div>
        <p id="conn-msg" style="color:var(--accent); font-size:0.9em; margin-top:10px; min-height:20px;"></p>
    </div>
</div>

<!-- 游戏界面 -->
<div id="game-screen" class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="margin:0;">丢手绢 <span id="mode-indicator" style="font-size:0.6em; color:#94a3b8;">(单机)</span></h3>
        <button style="background:none; border:none; color:#64748b; cursor:pointer;" onclick="location.reload()">退出</button>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <!-- 我方 -->
        <div class="player-info">
            <span id="p-role-badge" class="role-badge role-atk">我方</span>
            <span id="p-shield" class="shield-badge">🛡️ 免伤护盾</span>
            <div class="hp-bar-container">
                <div id="p-hp-bar" class="hp-bar" style="width: 100%; background-color: var(--success);"></div>
                <div id="p-hp-text" class="hp-text">40 / 40</div>
            </div>
        </div>
        
        <div style="font-size: 1.5em; font-weight: bold; color:#64748b;">VS</div>
        
        <!-- 敌方 -->
        <div class="player-info">
            <span id="op-role-badge" class="role-badge role-def">对手</span>
            <span id="op-shield" class="shield-badge">🛡️ 免伤护盾</span>
            <div class="hp-bar-container">
                <div id="op-hp-bar" class="hp-bar" style="width: 100%; background-color: var(--success);"></div>
                <div id="op-hp-text" class="hp-text">40 / 40</div>
            </div>
        </div>
    </div>

    <!-- 游戏主区域 -->
    <div class="game-arena">
        <div style="position: absolute; top: 10px; right: 15px; color: #64748b; font-size: 0.9em;">
            回合: <span id="current-turn">1</span> / 10
        </div>

        <!-- 结果展示区 -->
        <div class="result-display">
            <img id="result-img" class="result-img" src="" alt="结果图片">
            <div id="result-msg" class="result-text">等待开始...</div>
            <div id="waiting-indicator" style="display:none; color:var(--accent); margin-top:10px;">
                ⏳ 等待对手决策...
            </div>
        </div>

        <!-- 时间轴 -->
        <div class="timeline" id="timeline"></div>

        <!-- 操作按钮 -->
        <div id="game-controls" class="controls">
            <button id="btn-wait" class="btn btn-wait" onclick="handleInput('WAIT')">等待 (Wait)</button>
            <button id="btn-act" class="btn btn-act" onclick="handleInput('ACT')">行动</button>
        </div>

        <!-- 下一轮按钮 -->
        <div id="next-round-controls" class="controls" style="display:none;">
            <button class="btn btn-act" style="width:100%; background:var(--primary);" onclick="prepareNewRound()">
                确认结果，进入下一轮 →
            </button>
        </div>
    </div>
</div>

<!-- 游戏结束弹窗 -->
<div id="end-modal" class="modal">
    <div class="modal-content">
        <h2 id="end-title">游戏结束</h2>
        <p id="end-desc"></p>
        <button class="btn btn-act" onclick="location.reload()">返回大厅</button>
    </div>
</div>

<script>
    // 配置
    const MAX_HP = 40;
    const MAX_TURNS = 10;
    const IMG_EXT = '.png'; // 确保你的图片目录下有 间隔伤害.png, 误判.png, 识破.png

    // 游戏全局状态
    const state = {
        mode: 'pve', // 'pve' | 'pvp'
        myRole: 'atk', // 'atk' | 'def'
        turn: 1,
        pHP: 40,
        opHP: 40,
        droppedTurn: null, // 手绢在哪回合丢的
        
        // PvP 同步数据
        myMove: null, // 当前回合我的操作
        opMove: null, // 当前回合对手的操作
        readyForNextRound: false,
        opReady: false,

        // 护盾逻辑
        pShield: false,
        opShield: false,
        
        gameOver: false
    };

    // 网络相关
    let peer = null;
    let conn = null;

    // DOM 引用
    const ui = {
        menu: document.getElementById('menu-screen'),
        game: document.getElementById('game-screen'),
        connMsg: document.getElementById('conn-msg'),
        turn: document.getElementById('current-turn'),
        timeline: document.getElementById('timeline'),
        btnAct: document.getElementById('btn-act'),
        btnWait: document.getElementById('btn-wait'),
        gameControls: document.getElementById('game-controls'),
        nextControls: document.getElementById('next-round-controls'),
        msg: document.getElementById('result-msg'),
        waitInd: document.getElementById('waiting-indicator'),
        img: document.getElementById('result-img'),
        pBadge: document.getElementById('p-role-badge'),
        opBadge: document.getElementById('op-role-badge'),
        pHpBar: document.getElementById('p-hp-bar'),
        opHpBar: document.getElementById('op-hp-bar'),
        pHpText: document.getElementById('p-hp-text'),
        opHpText: document.getElementById('op-hp-text'),
        pShield: document.getElementById('p-shield'),
        opShield: document.getElementById('op-shield'),
        netStatus: document.getElementById('net-status')
    };

    // ==========================================
    // 1. 初始化与模式选择
    // ==========================================

    function startGame(mode) {
        state.mode = mode;
        ui.menu.style.display = 'none';
        ui.game.style.display = 'block';
        document.getElementById('mode-indicator').textContent = mode === 'pve' ? '(单机)' : '(联机)';
        
        if (mode === 'pve') {
            state.myRole = Math.random() > 0.5 ? 'atk' : 'def';
            initRound(true);
        } else {
            // PvP 在连接成功后才初始化回合
        }
    }

    // ==========================================
    // 2. 网络联机逻辑 (PeerJS)
    // ==========================================

    function initNetwork(type) {
        const code = document.getElementById('room-code').value.trim();
        if (!code) { ui.connMsg.textContent = "请输入房间号！"; return; }
        
        ui.connMsg.textContent = "连接服务器中...";
        
        // 为了简化，我们用固定规则生成 PeerID
        // Host ID: hdk-room-[code]-host
        // Join ID: hdk-room-[code]-join
        const prefix = "hdk-room-" + code;
        const myId = type === 'host' ? prefix + "-host" : prefix + "-join";
        const targetId = type === 'host' ? prefix + "-join" : prefix + "-host";

        peer = new Peer(myId, { debug: 1 });

        peer.on('open', (id) => {
            ui.connMsg.textContent = "服务器连接成功，等待对手...";
            ui.netStatus.textContent = "在线: " + (type==='host'?'房主':'访客');
            ui.netStatus.style.color = "#10b981";

            if (type === 'join') {
                // 访客主动连接房主
                conn = peer.connect(targetId);
                setupConnection();
            }
        });

        peer.on('connection', (c) => {
            // 房主被连接
            if (type === 'host') {
                conn = c;
                setupConnection();
            }
        });

        peer.on('error', (err) => {
            console.error(err);
            ui.connMsg.textContent = "连接失败 (房间可能已被占用或网络错误)";
        });
    }

    function setupConnection() {
        conn.on('open', () => {
            console.log("Connected to peer");
            startGame('pvp');
            
            // 房主决定谁先手
            if (peer.id.includes("-host")) {
                const hostIsAtk = Math.random() > 0.5;
                state.myRole = hostIsAtk ? 'atk' : 'def';
                // 发送初始配置给 Joiner
                sendData({ type: 'INIT_GAME', hostRole: state.myRole });
                initRound(true); // 房主开始
            }
        });

        conn.on('data', (data) => {
            handleNetworkData(data);
        });

        conn.on('close', () => {
            alert("对方已断开连接");
            location.reload();
        });
    }

    function sendData(data) {
        if (conn && conn.open) {
            conn.send(data);
        }
    }

    function handleNetworkData(data) {
        switch(data.type) {
            case 'INIT_GAME':
                // 接收房主的分配
                state.myRole = (data.hostRole === 'atk') ? 'def' : 'atk';
                initRound(true);
                break;
            case 'MOVE':
                // 接收对手操作
                state.opMove = data.action;
                checkTurnResolution();
                break;
            case 'NEXT_ROUND':
                // 对手已准备好下一轮
                state.opReady = true;
                checkNextRound();
                break;
        }
    }

    // ==========================================
    // 3. 游戏核心流程
    // ==========================================

    // 初始化新的一轮（或第一轮）
    function initRound(isFirst = false) {
        if (state.pHP <= 0 || state.opHP <= 0) return endGame();

        state.turn = 1;
        state.droppedTurn = null;
        state.myMove = null;
        state.opMove = null;
        state.readyForNextRound = false;
        state.opReady = false;

        // 互换攻守 (非第一轮)
        if (!isFirst) {
            state.myRole = (state.myRole === 'atk') ? 'def' : 'atk';
        }

        // --- 护盾检测 ---
        // 规则：血量 < 20 的一方在担任守方时获得护盾
        // 我是守方
        if (state.myRole === 'def') {
            state.pShield = state.pHP < 20;
            state.opShield = false; // 攻方没有护盾
        } else {
            // 我是攻方，对手是守方
            state.opShield = state.opHP < 20;
            state.pShield = false; 
        }

        // UI重置
        ui.gameControls.style.display = 'flex';
        ui.nextControls.style.display = 'none';
        ui.img.style.display = 'none';
        ui.msg.innerHTML = `新的一轮开始！${state.pShield || state.opShield ? '<br><span style="color:var(--accent)">🛡️ 血量过低，守方获得[误判免疫]护盾！</span>' : ''}`;
        
        updateUI();
        renderTimeline();
    }

    // 玩家输入处理
    function handleInput(action) {
        if (state.gameOver) return;
        
        // 锁定按钮防止重复点击
        ui.btnAct.disabled = true;
        ui.btnWait.disabled = true;
        ui.waitInd.style.display = 'block';

        state.myMove = action;

        if (state.mode === 'pve') {
            // 单机：立即生成 AI 动作并结算
            state.opMove = getAIDecision();
            checkTurnResolution();
        } else {
            // 联机：发送动作给对手，等待对手
            sendData({ type: 'MOVE', turn: state.turn, action: action });
            ui.msg.textContent = "已行动，等待对手...";
            checkTurnResolution();
        }
    }

    // AI 决策逻辑
    function getAIDecision() {
        const remaining = 11 - state.turn;
        // AI 是守方 (如果我是攻方)
        if (state.myRole === 'atk') {
             // 越往后越可能回头，第10回合必回头
             if (state.turn === 10) return 'ACT';
             let prob = 0.1 + (state.turn * 0.08);
             return Math.random() < prob ? 'ACT' : 'WAIT';
        } else {
            // AI 是攻方 (如果我是守方)
            if (state.droppedTurn !== null) return 'WAIT'; // 已经丢了
            if (state.turn === 10) return 'ACT'; // 第10回合必丢
            let prob = 1 / remaining;
            return Math.random() < prob * 1.6 ? 'ACT' : 'WAIT';
        }
    }

    // 检查是否双方都已行动，可以结算
    function checkTurnResolution() {
        if (state.myMove && state.opMove) {
            resolveTurn();
        }
    }

    // 核心结算逻辑
    function resolveTurn() {
        ui.waitInd.style.display = 'none';
        ui.btnAct.disabled = false;
        ui.btnWait.disabled = false;

        const amIAtk = state.myRole === 'atk';
        const atkAction = amIAtk ? state.myMove : state.opMove;
        const defAction = amIAtk ? state.opMove : state.myMove;
        
        let roundEnds = false;
        let damageMsg = '';
        let triggerType = '';

        // 1. 攻方逻辑
        if (state.droppedTurn === null && atkAction === 'ACT') {
            state.droppedTurn = state.turn; // 记录丢下手绢的回合
        }

        // --- 特殊规则：第10回合强制逻辑 ---
        if (state.turn === 10) {
            // 如果攻方还没丢，第10回合视为丢下
            if (state.droppedTurn === null) state.droppedTurn = 10;
            // 如果守方没回头，第10回合视为回头 (强制 ACT)
            // 这样会触发下面的 'ACT' 判定逻辑
        }

        // 2. 守方逻辑 (如果回头，或者第10回合强制结算)
        if (defAction === 'ACT' || state.turn === 10) {
            
            // 情况 A: 误判 (回头了，但攻方没丢，且不是第10回合)
            if (state.droppedTurn === null || state.droppedTurn > state.turn) {
                // 检查护盾
                const defHasShield = amIAtk ? state.opShield : state.pShield;
                
                if (defHasShield) {
                    // 消耗护盾，不扣血，游戏继续
                    consumeShield(amIAtk ? 'op' : 'p');
                    let defName = amIAtk ? "对手" : "你";
                    ui.msg.innerHTML = `<span style="color:var(--accent)">🛡️ ${defName} 发生误判，但护盾抵消了惩罚！游戏继续。</span>`;
                    
                    // 即使护盾抵消，如果是第10回合，也必须结束
                    if (state.turn === 10) roundEnds = true; 
                    else {
                         // 仅仅消耗护盾，下一回合继续
                         state.myMove = null; state.opMove = null;
                         state.turn++;
                         updateUI(); renderTimeline();
                         return;
                    }
                } else {
                    triggerType = 'mistake';
                    applyDamage(amIAtk ? 'op' : 'p', 10);
                    damageMsg = "【误判】守方回头太早，手绢还没丢！守方 HP -10";
                    roundEnds = true;
                }
            } 
            // 情况 B: 识破 (正好在这一回合丢) 或者是第10回合双向强制
            else if (state.droppedTurn === state.turn) {
                triggerType = 'caught';
                // 守方 +5 (负伤害), 攻方 -10
                applyDamage(amIAtk ? 'op' : 'p', -5); 
                applyDamage(amIAtk ? 'p' : 'op', 10);
                damageMsg = "【识破】抓个正着！<span style='color:var(--success)'>守方 HP +5</span>，<span style='color:var(--danger)'>攻方 HP -10</span>";
                roundEnds = true;
            } 
            // 情况 C: 间隔伤害 (很久以前丢的)
            else {
                let dmg = state.turn - state.droppedTurn;
                triggerType = 'interval';
                applyDamage(amIAtk ? 'op' : 'p', dmg);
                damageMsg = `【间隔伤害】反应太慢！延迟了 ${dmg} 回合。守方 HP -${dmg}`;
                roundEnds = true;
            }
        }

        if (roundEnds) {
            showTriggerResult(triggerType, damageMsg);
            ui.gameControls.style.display = 'none';
            ui.nextControls.style.display = 'flex';
        } else {
            // 无事发生，下一回合
            state.myMove = null;
            state.opMove = null;
            state.turn++;
            updateUI();
            renderTimeline();
        }
    }

    // ==========================================
    // 4. 辅助功能与UI更新
    // ==========================================

    function consumeShield(who) {
        if (who === 'p') state.pShield = false;
        else state.opShield = false;
        updateUI();
    }

    function applyDamage(target, amount) {
        if (target === 'p') state.pHP = Math.max(0, Math.min(MAX_HP, state.pHP - amount));
        else state.opHP = Math.max(0, Math.min(MAX_HP, state.opHP - amount));
    }

    function prepareNewRound() {
        ui.nextControls.style.display = 'none';
        ui.msg.textContent = "等待对手确认...";
        
        if (state.mode === 'pve') {
            initRound();
        } else {
            state.readyForNextRound = true;
            sendData({ type: 'NEXT_ROUND' });
            checkNextRound();
        }
    }

    function checkNextRound() {
        if (state.readyForNextRound && state.opReady) {
            initRound();
        }
    }

    function showTriggerResult(type, msg) {
        let imgName = '';
        if (type === 'interval') imgName = '间隔伤害';
        if (type === 'mistake') imgName = '误判';
        if (type === 'caught') imgName = '识破';

        // 如果是第10回合强制结算可能没有type (护盾抵消情况)
        if (!type && state.turn === 10) {
            ui.msg.innerHTML = "第10回合结束，双方平安无事 (护盾生效)。";
            return;
        }

        if (imgName) {
            ui.img.src = imgName + IMG_EXT;
            ui.img.style.display = 'block';
            ui.img.classList.add('fade-in');
        }
        ui.msg.innerHTML = msg;
    }

    function updateUI() {
        // 更新血条
        ui.pHpText.textContent = `${state.pHP} / ${MAX_HP}`;
        ui.opHpText.textContent = `${state.opHP} / ${MAX_HP}`;
        ui.pHpBar.style.width = (state.pHP / MAX_HP * 100) + '%';
        ui.opHpBar.style.width = (state.opHP / MAX_HP * 100) + '%';
        
        // 角色徽章
        if (state.myRole === 'atk') {
            ui.pBadge.className = 'role-badge role-atk'; ui.pBadge.textContent = '我方 (攻:丢手绢)';
            ui.opBadge.className = 'role-badge role-def'; ui.opBadge.textContent = '对手 (守:查杀)';
            
            // 按钮文字
            if (state.droppedTurn !== null) {
                ui.btnAct.style.display = 'none';
                ui.btnWait.textContent = "保持不动";
            } else {
                ui.btnAct.style.display = 'inline-block';
                ui.btnAct.textContent = "丢下";
                ui.btnWait.textContent = "持有";
            }
        } else {
            ui.pBadge.className = 'role-badge role-def'; ui.pBadge.textContent = '我方 (守:查杀)';
            ui.opBadge.className = 'role-badge role-atk'; ui.opBadge.textContent = '对手 (攻:丢手绢)';
            
            ui.btnAct.style.display = 'inline-block';
            ui.btnAct.textContent = "回头";
            ui.btnWait.textContent = "继续走";
        }

        // 护盾图标
        ui.pShield.style.display = state.pShield ? 'inline-block' : 'none';
        ui.opShield.style.display = state.opShield ? 'inline-block' : 'none';

        // 回合数
        ui.turn.textContent = state.turn;
    }

    function renderTimeline() {
        ui.timeline.innerHTML = '';
        for (let i = 1; i <= MAX_TURNS; i++) {
            let div = document.createElement('div');
            div.className = 'time-slot';
            div.textContent = i;
            if (i === state.turn) div.classList.add('active');
            if (i < state.turn) div.classList.add('past');
            
            // 只有 我是攻方 且 我丢了，或者 游戏结算揭晓时，才显示手绢
            const showItem = (state.myRole === 'atk' && state.droppedTurn && i >= state.droppedTurn);
            if (showItem) div.classList.add('has-item');
            
            ui.timeline.appendChild(div);
        }
    }

    function endGame() {
        state.gameOver = true;
        document.getElementById('end-modal').style.display = 'flex';
        const title = document.getElementById('end-title');
        const desc = document.getElementById('end-desc');
        
        const win = state.pHP > 0;
        title.textContent = win ? "你赢了！" : "你输了";
        title.style.color = win ? "var(--success)" : "var(--danger)";
        desc.textContent = win ? "恭喜你击败了对手！" : "胜败乃兵家常事，大侠请重新来过。";
    }

</script>
</body>
</html>
