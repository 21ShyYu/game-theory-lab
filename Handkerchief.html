<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博弈实验室：丢手绢 (完美联机版)</title>
    <p style="text-align: center; color: #64748b; font-size: 0.9em; margin: 0 0 10px 0;">作者：iyushy</p>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #06b6d4;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --panel-bg: #111827;
            --text: #f1f5f9;
            --danger: #ef4444;
            --success: #10b981;
            --accent: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 布局容器 */
        .main-layout {
            display: flex;
            flex-wrap: wrap;
            max-width: 1200px;
            width: 98%;
            gap: 20px;
            margin: 20px auto;
            justify-content: center;
            display: none; 
        }

        .game-column { flex: 2; min-width: 350px; max-width: 800px; }
        .side-column { flex: 1; min-width: 300px; max-width: 400px; display: flex; flex-direction: column; height: 600px; }

        /* 菜单屏幕 */
        #menu-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 80vh; gap: 20px; width: 100%;
        }
        .menu-card {
            background: var(--card-bg); padding: 40px; border-radius: 20px;
            text-align: center; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%; max-width: 400px;
        }
        input.room-input {
            width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px;
            border: 1px solid #475569; background: #0f172a; color: white; font-size: 1.2em; text-align: center;
        }

        /* 状态栏 */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 15px; border-radius: 15px;
            border: 1px solid #334155; margin-bottom: 15px;
        }

        .shield-badge {
            background: var(--accent); color: black; padding: 2px 6px; border-radius: 4px;
            font-size: 0.7em; font-weight: bold; margin-left: 5px; display: none;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

        .decision-badge {
            background: var(--success); color: black; padding: 2px 6px; border-radius: 4px;
            font-size: 0.7em; font-weight: bold; display: none; margin-top: 5px;
        }

        .player-info { text-align: center; width: 42%; position: relative; }
        .role-badge { 
            display: inline-block; padding: 4px 8px; border-radius: 4px; 
            font-size: 0.8em; margin-bottom: 5px; font-weight: bold;
        }
        .role-atk { background: var(--secondary); color: black; }
        .role-def { background: var(--primary); color: white; }

        .hp-bar-container {
            height: 15px; background: #0f172a; border-radius: 10px; overflow: hidden;
            margin-top: 5px; position: relative; border: 1px solid #334155;
        }
        .hp-bar { height: 100%; transition: width 0.5s ease; }
        .hp-text { position: absolute; width: 100%; text-align: center; font-size: 0.7em; line-height: 15px; top: 0; text-shadow: 1px 1px 1px black; z-index: 2; }

        /* 游戏区 */
        .game-arena {
            background: var(--card-bg); padding: 20px; border-radius: 15px;
            min-height: 400px; display: flex; flex-direction: column; align-items: center; position: relative;
        }
        .timeline { display: flex; gap: 6px; margin: 20px 0; flex-wrap: wrap; justify-content: center; }
        .time-slot {
            width: 28px; height: 28px; border-radius: 50%; background: #334155;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.8em; color: #94a3b8; transition: 0.3s; position: relative;
        }
        .time-slot.active { background: var(--text); color: var(--bg); box-shadow: 0 0 10px white; transform: scale(1.2); z-index: 10; }
        .time-slot.past { background: #475569; }
        .time-slot.has-item::after { content: '🧣'; font-size: 1.2em; position: absolute; top: -20px; }

        .result-display { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 10px; }
        .result-img { max-width: 250px; max-height: 180px; border-radius: 10px; border: 2px solid var(--text); display: none; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .result-text { margin-top: 10px; font-size: 1.1em; text-align: center; min-height: 2.5em; }

        .controls { display: flex; gap: 15px; margin-top: auto; justify-content: center; width: 100%; }
        .btn {
            padding: 12px 25px; border: none; border-radius: 8px; font-size: 1em;
            font-weight: bold; cursor: pointer; transition: 0.2s; color: white; flex: 1; max-width: 180px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        .btn-act { background: var(--secondary); box-shadow: 0 4px 0 #0891b2; }
        .btn-act:active { transform: translateY(4px); box-shadow: none; }
        .btn-wait { background: #475569; box-shadow: 0 4px 0 #334155; }
        .btn-wait:active { transform: translateY(4px); box-shadow: none; }
        
        /* 侧边栏 (Tab页) */
        .tabs { display: flex; margin-bottom: 0; }
        .tab-btn {
            flex: 1; padding: 10px; background: #334155; border: none; color: #94a3b8; cursor: pointer;
            border-top-left-radius: 10px; border-top-right-radius: 10px; font-weight: bold;
        }
        .tab-btn.active { background: var(--panel-bg); color: var(--text); border-bottom: 2px solid var(--primary); }
        .tab-content {
            background: var(--panel-bg); flex: 1; border-radius: 0 0 15px 15px;
            padding: 15px; overflow-y: auto; display: none; flex-direction: column;
            border: 1px solid #334155; border-top: none;
        }
        .tab-content.active { display: flex; }

        .log-entry {
            background: rgba(255,255,255,0.05); padding: 8px; margin-bottom: 8px; border-radius: 6px; font-size: 0.9em;
            border-left: 3px solid #64748b;
        }
        .log-entry.log-mistake { border-left-color: var(--danger); }
        .log-entry.log-caught { border-left-color: var(--success); }
        
        .chat-msgs { flex: 1; overflow-y: auto; padding-right: 5px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 0.9em; word-wrap: break-word; }
        .chat-me { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .chat-op { align-self: flex-start; background: #334155; color: #e2e8f0; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; gap: 5px; flex-direction: column; }
        .emoji-bar { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; }
        .emoji-btn { background: none; border: none; font-size: 1.2em; cursor: pointer; padding: 2px; }
        .chat-input-row { display: flex; gap: 5px; }
        .chat-input { flex: 1; background: #1e293b; border: 1px solid #475569; color: white; padding: 8px; border-radius: 5px; }

        /* 模态框 */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center;
            z-index: 100; display: none;
        }
        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 15px; 
            text-align: center; border: 2px solid var(--primary); max-width: 90%; width: 400px;
        }
        #net-status { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; font-size: 0.8em; color: #aaa; z-index: 99; }
        
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .side-column { height: 400px; }
        }
    </style>
</head>
<body>

<div id="net-status">状态: 离线</div>

<!-- 菜单界面 -->
<div id="menu-screen">
    <h1 style="color:var(--primary); text-shadow: 0 0 10px var(--primary);">博弈实验室：丢手绢</h1>
    
    <div class="menu-card">
        <h3>单人模式 (PvE)</h3>
        <p style="color:#94a3b8; font-size:0.9em;">挑战 AI 逻辑</p>
        <button class="btn btn-wait" onclick="startGame('pve')">开始单机</button>
    </div>

    <div class="menu-card" style="border-color: var(--secondary);">
        <h3>联机对战 (PvP)</h3>
        <p style="color:#94a3b8; font-size:0.9em;">输入相同的房间号 (如: 1234)</p>
        <input type="text" id="room-code" class="room-input" placeholder="输入房间号" maxlength="10">
        <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
            <button class="btn btn-act" style="min-width:100px; font-size:1em;" onclick="initNetwork('host')">我是房主</button>
            <button class="btn btn-act" style="min-width:100px; font-size:1em; background:var(--primary); box-shadow:0 4px 0 #7c3aed;" onclick="initNetwork('join')">加入房间</button>
        </div>
        <p id="conn-msg" style="color:var(--accent); font-size:0.9em; margin-top:10px; min-height:20px;"></p>
    </div>
</div>

<!-- 游戏主界面 -->
<div id="game-layout" class="main-layout">
    
    <!-- 左侧：游戏区 -->
    <div class="game-column">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3 style="margin:0;">丢手绢 <span id="mode-indicator" style="font-size:0.6em; color:#94a3b8;"></span></h3>
            <button style="background:none; border:none; color:#64748b; cursor:pointer;" onclick="confirmExit()">退出</button>
        </div>

        <div class="status-bar">
            <!-- 我方 -->
            <div class="player-info">
                <span id="p-role-badge" class="role-badge role-atk">我方</span>
                <span id="p-shield" class="shield-badge">🛡️ 护盾</span>
                <div class="hp-bar-container">
                    <div id="p-hp-bar" class="hp-bar" style="width: 100%; background-color: var(--success);"></div>
                    <div id="p-hp-text" class="hp-text">40 / 40</div>
                </div>
            </div>
            <div style="font-size: 1.5em; font-weight: bold; color:#64748b;">VS</div>
            <!-- 敌方 -->
            <div class="player-info">
                <span id="op-role-badge" class="role-badge role-def">对手</span>
                <span id="op-shield" class="shield-badge">🛡️ 护盾</span>
                <div id="op-decision" class="decision-badge">✅ 已决策</div>
                <div class="hp-bar-container">
                    <div id="op-hp-bar" class="hp-bar" style="width: 100%; background-color: var(--success);"></div>
                    <div id="op-hp-text" class="hp-text">40 / 40</div>
                </div>
            </div>
        </div>

        <div class="game-arena">
            <div style="position: absolute; top: 10px; right: 15px; color: #64748b; font-size: 0.9em;">
                回合: <span id="current-turn">1</span> / 10
            </div>

            <div class="result-display">
                <img id="result-img" class="result-img" src="" alt="结果图片">
                <div id="result-msg" class="result-text">等待开始...</div>
                <div id="waiting-indicator" style="display:none; color:var(--accent); margin-top:10px; font-size:0.9em;">
                    ⏳ 等待对手决策...
                </div>
            </div>

            <div class="timeline" id="timeline"></div>

            <!-- 游戏中操作栏 -->
            <div id="game-controls" class="controls">
                <button id="btn-wait" class="btn btn-wait" onclick="handleInput('WAIT')">等待 (Wait)</button>
                <button id="btn-act" class="btn btn-act" onclick="handleInput('ACT')">行动</button>
            </div>
            
            <!-- 回合间操作栏 -->
            <div id="next-round-controls" class="controls" style="display:none;">
                <button class="btn btn-act" style="width:100%; background:var(--primary);" onclick="prepareNewRound()">
                    确认结果，下一轮 →
                </button>
            </div>

            <!-- 游戏结束后的操作栏 (查看战局时显示) -->
            <div id="game-over-controls" class="controls" style="display:none; margin-top:20px;">
                <button id="btn-restart-panel" class="btn btn-act" onclick="requestRestart()">🔄 再来一局</button>
                <button class="btn btn-wait" onclick="confirmExit()">🚪 退出房间</button>
            </div>
        </div>
    </div>

    <!-- 右侧：侧边栏 -->
    <div class="side-column">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('log')">📋 战况记录</button>
            <button class="tab-btn" id="tab-chat-btn" onclick="switchTab('chat')">💬 聊天室</button>
        </div>
        
        <div id="tab-log" class="tab-content active">
            <div id="log-list" style="flex:1;">
                <div style="text-align:center; color:#64748b; margin-top:20px;">暂无记录</div>
            </div>
        </div>

        <div id="tab-chat" class="tab-content">
            <div id="chat-msgs" class="chat-msgs">
                <div class="chat-bubble chat-op">连接成功，可以开始聊天了！</div>
            </div>
            <div class="chat-input-area">
                <div class="emoji-bar">
                    <button class="emoji-btn" onclick="sendEmoji('👋')">👋</button>
                    <button class="emoji-btn" onclick="sendEmoji('👍')">👍</button>
                    <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                    <button class="emoji-btn" onclick="sendEmoji('🤔')">🤔</button>
                    <button class="emoji-btn" onclick="sendEmoji('😱')">😱</button>
                    <button class="emoji-btn" onclick="sendEmoji('😭')">😭</button>
                    <button class="emoji-btn" onclick="sendEmoji('😡')">😡</button>
                    <button class="emoji-btn" onclick="sendEmoji('🤝')">🤝</button>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" class="chat-input" placeholder="输入消息..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button class="btn btn-act" style="padding: 8px 15px; min-width: 50px;" onclick="sendChat()">发送</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 游戏结束弹窗 -->
<div id="end-modal" class="modal">
    <div class="modal-content">
        <h2 id="end-title">游戏结束</h2>
        <p id="end-desc"></p>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
            <button id="btn-restart-modal" class="btn btn-act" style="background:var(--success);" onclick="requestRestart()">🔄 再来一局</button>
            <button class="btn btn-wait" onclick="viewBoard()">🔎 查看战局 (暂不退出)</button>
            <button class="btn btn-danger" style="margin-top:10px;" onclick="confirmExit()">🏠 返回大厅</button>
        </div>
    </div>
</div>

<script>
    // 配置
    const MAX_HP = 40;
    const MAX_TURNS = 10;
    const IMG_EXT = '.png'; 

    // 游戏全局状态
    const state = {
        mode: 'pve', 
        myRole: 'atk', 
        turn: 1,
        pHP: 40,
        opHP: 40,
        droppedTurn: null,
        myMove: null,
        opMove: null,
        readyForNextRound: false,
        opReady: false,
        pShield: false,
        opShield: false,
        gameOver: false,
        roundCount: 1,
        // 新增：重开状态
        restartReq: false,
        opRestartReq: false
    };

    let peer = null;
    let conn = null;

    // DOM 引用
    const ui = {
        menu: document.getElementById('menu-screen'),
        layout: document.getElementById('game-layout'),
        connMsg: document.getElementById('conn-msg'),
        turn: document.getElementById('current-turn'),
        timeline: document.getElementById('timeline'),
        btnAct: document.getElementById('btn-act'),
        btnWait: document.getElementById('btn-wait'),
        gameControls: document.getElementById('game-controls'),
        nextControls: document.getElementById('next-round-controls'),
        gameOverControls: document.getElementById('game-over-controls'),
        msg: document.getElementById('result-msg'),
        waitInd: document.getElementById('waiting-indicator'),
        img: document.getElementById('result-img'),
        pBadge: document.getElementById('p-role-badge'),
        opBadge: document.getElementById('op-role-badge'),
        pHpBar: document.getElementById('p-hp-bar'),
        opHpBar: document.getElementById('op-hp-bar'),
        pHpText: document.getElementById('p-hp-text'),
        opHpText: document.getElementById('op-hp-text'),
        pShield: document.getElementById('p-shield'),
        opShield: document.getElementById('op-shield'),
        opDecision: document.getElementById('op-decision'),
        netStatus: document.getElementById('net-status'),
        logList: document.getElementById('log-list'),
        chatMsgs: document.getElementById('chat-msgs'),
        chatInput: document.getElementById('chat-input'),
        chatTabBtn: document.getElementById('tab-chat-btn'),
        endModal: document.getElementById('end-modal'),
        btnRestartModal: document.getElementById('btn-restart-modal'),
        btnRestartPanel: document.getElementById('btn-restart-panel')
    };

    // ================= 1. 初始化 =================
    function startGame(mode) {
        state.mode = mode;
        ui.menu.style.display = 'none';
        ui.layout.style.display = 'flex';
        document.getElementById('mode-indicator').textContent = mode === 'pve' ? '(单机)' : '(联机)';
        
        if (mode === 'pve') {
            ui.chatTabBtn.style.display = 'none';
            ui.btnRestartModal.textContent = "🔄 再来一局";
            ui.btnRestartPanel.textContent = "🔄 再来一局";
            state.myRole = Math.random() > 0.5 ? 'atk' : 'def';
            addLogSystemMsg("游戏开始 - 单人模式");
            initRound(true);
        } else {
             ui.chatTabBtn.style.display = 'block';
             addLogSystemMsg("游戏开始 - 联机对战");
        }
    }

    function confirmExit() {
        if(confirm("确定要退出游戏返回大厅吗？")) location.reload();
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        document.querySelector(`.tab-btn[onclick="switchTab('${tabName}')"]`).classList.add('active');
    }

    // ================= 2. 网络逻辑 (修复版) =================
    function initNetwork(type) {
        const code = document.getElementById('room-code').value.trim();
        if (!code) { ui.connMsg.textContent = "请输入房间号！"; return; }
        
        ui.connMsg.textContent = "正在尝试连接节点...";
        const prefix = "hdk-room-" + code;
        const myId = type === 'host' ? prefix + "-host" : prefix + "-join";
        const targetId = type === 'host' ? prefix + "-join" : prefix + "-host";

        // 配置 STUN 用于直连
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.miwifi.com:3478' },
                    { urls: 'stun:stun.qq.com:3478' },
                    { urls: 'stun:stun.stunprotocol.org:3478' },
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            },
            debug: 1 
        };

        peer = new Peer(myId, peerConfig);

        peer.on('open', (id) => {
            ui.connMsg.textContent = "服务连接成功，等待对手...";
            ui.netStatus.textContent = "🟢 在线: " + (type==='host'?'房主':'访客');
            ui.netStatus.style.color = "#10b981";
            if (type === 'join') {
                conn = peer.connect(targetId);
                setupConnection();
            }
        });

        peer.on('connection', (c) => {
            if (type === 'host') {
                conn = c;
                setupConnection();
            }
        });

        peer.on('error', (err) => {
            console.error(err);
            if (err.type === 'peer-unavailable') ui.connMsg.textContent = "未找到房间主机。";
            else if (err.type === 'unavailable-id') ui.connMsg.textContent = "房间号被占用。";
            else ui.connMsg.textContent = "连接错误: " + err.type;
        });

        peer.on('disconnected', () => {
             ui.netStatus.textContent = "🔴 断开";
             ui.netStatus.style.color = "var(--danger)";
             peer.reconnect();
        });
    }

    function setupConnection() {
        conn.on('open', () => {
            startGame('pvp');
            if (peer.id.includes("-host")) {
                const hostIsAtk = Math.random() > 0.5;
                state.myRole = hostIsAtk ? 'atk' : 'def';
                sendData({ type: 'INIT_GAME', hostRole: state.myRole });
                initRound(true);
            }
        });

        conn.on('data', (data) => handleNetworkData(data));
        conn.on('close', () => { alert("对方已断开"); location.reload(); });
    }

    function sendData(data) { if (conn && conn.open) conn.send(data); }

    function handleNetworkData(data) {
        switch(data.type) {
            case 'INIT_GAME':
                state.myRole = (data.hostRole === 'atk') ? 'def' : 'atk';
                initRound(true);
                break;
            case 'MOVE':
                state.opMove = data.action;
                if (!state.myMove) ui.opDecision.style.display = 'inline-block';
                checkTurnResolution();
                break;
            case 'NEXT_ROUND':
                state.opReady = true;
                checkNextRound();
                break;
            case 'CHAT':
                addChatMessage('op', data.content);
                break;
            // 新增：重开请求处理
            case 'RESTART_REQUEST':
                state.opRestartReq = true;
                if (state.restartReq) {
                    restartGame();
                } else {
                    addLogSystemMsg("对手请求再来一局...");
                    ui.btnRestartModal.textContent = "✔ 接受重开请求";
                    ui.btnRestartPanel.textContent = "✔ 接受重开请求";
                    // 如果在看战绩，可以给个弹窗提示
                    if (ui.endModal.style.display === 'none') {
                        ui.msg.innerHTML = "<span style='color:var(--accent)'>对手请求再来一局，请点击下方按钮接受</span>";
                    }
                }
                break;
        }
    }

    // ================= 3. 游戏逻辑 =================
    function initRound(isFirst = false) {
        if (state.pHP <= 0 || state.opHP <= 0) return endGame();

        state.turn = 1;
        state.droppedTurn = null;
        state.myMove = null;
        state.opMove = null;
        state.readyForNextRound = false;
        state.opReady = false;
        
        if (!isFirst) {
            state.myRole = (state.myRole === 'atk') ? 'def' : 'atk';
            state.roundCount++;
        }

        // 护盾逻辑
        if (state.myRole === 'def') {
            state.pShield = state.pHP < 20;
            state.opShield = false;
        } else {
            state.opShield = state.opHP < 20;
            state.pShield = false; 
        }

        // UI重置
        ui.gameControls.style.display = 'flex';
        ui.nextControls.style.display = 'none';
        ui.gameOverControls.style.display = 'none'; // 隐藏结束操作栏
        ui.img.style.display = 'none';
        ui.opDecision.style.display = 'none';
        ui.waitInd.style.display = 'none';
        ui.btnAct.disabled = false;
        ui.btnWait.disabled = false;

        let shieldTxt = (state.pShield || state.opShield) ? '<br><span style="color:var(--accent)">🛡️ 守方血量<20，获得误判免疫！</span>' : '';
        ui.msg.innerHTML = `第 ${state.roundCount} 轮开始！${shieldTxt}`;
        
        updateUI();
        renderTimeline();
    }

    function handleInput(action) {
        if (state.gameOver) return;
        ui.btnAct.disabled = true; ui.btnWait.disabled = true;
        ui.waitInd.style.display = 'block';
        state.myMove = action;

        if (state.mode === 'pve') {
            setTimeout(() => {
                state.opMove = getAIDecision();
                checkTurnResolution();
            }, 500);
        } else {
            sendData({ type: 'MOVE', turn: state.turn, action: action });
            ui.msg.textContent = "已行动，等待对手...";
            checkTurnResolution();
        }
    }

    function getAIDecision() {
        const remaining = 11 - state.turn;
        if (state.myRole === 'atk') {
             if (state.turn === 10) return 'ACT';
             let prob = 0.1 + (state.turn * 0.08);
             return Math.random() < prob ? 'ACT' : 'WAIT';
        } else {
            if (state.droppedTurn !== null) return 'WAIT'; 
            if (state.turn === 10) return 'ACT';
            let prob = 1 / remaining;
            return Math.random() < prob * 1.6 ? 'ACT' : 'WAIT';
        }
    }

    function checkTurnResolution() {
        if (state.myMove && state.opMove) resolveTurn();
    }

    function resolveTurn() {
        ui.waitInd.style.display = 'none';
        ui.opDecision.style.display = 'none';
        ui.btnAct.disabled = false; ui.btnWait.disabled = false;

        const amIAtk = state.myRole === 'atk';
        const atkAction = amIAtk ? state.myMove : state.opMove;
        const defAction = amIAtk ? state.opMove : state.myMove;
        
        let roundEnds = false;
        let damageMsg = '';
        let triggerType = '';
        let dmgP = 0, dmgOp = 0;

        if (state.droppedTurn === null && atkAction === 'ACT') state.droppedTurn = state.turn;
        if (state.turn === 10 && state.droppedTurn === null) state.droppedTurn = 10;

        if (defAction === 'ACT' || state.turn === 10) {
            if (state.droppedTurn === null || state.droppedTurn > state.turn) {
                const defHasShield = amIAtk ? state.opShield : state.pShield;
                if (defHasShield) {
                    consumeShield(amIAtk ? 'op' : 'p');
                    let defName = amIAtk ? "对手" : "我方";
                    ui.msg.innerHTML = `<span style="color:var(--accent)">🛡️ ${defName} 误判，护盾抵消惩罚！</span>`;
                    if (state.turn === 10) {
                         roundEnds = true;
                         addLogEntry(state.roundCount, "平局", 0, 0, "第10回合+护盾");
                    } else {
                         state.myMove = null; state.opMove = null;
                         state.turn++;
                         updateUI(); renderTimeline();
                         return;
                    }
                } else {
                    triggerType = 'mistake';
                    if (amIAtk) dmgOp = -10; else dmgP = -10;
                    damageMsg = "【误判】守方回头太早！守方 HP -10";
                    roundEnds = true;
                }
            } else if (state.droppedTurn === state.turn) {
                triggerType = 'caught';
                if (amIAtk) { dmgP = -10; dmgOp = 5; } else { dmgP = 5; dmgOp = -10; }
                damageMsg = "【识破】抓个正着！守方+5，攻方-10";
                roundEnds = true;
            } else {
                triggerType = 'interval';
                let dmg = state.turn - state.droppedTurn;
                if (amIAtk) dmgOp = -dmg; else dmgP = -dmg;
                damageMsg = `【间隔伤害】延迟了 ${dmg} 回合。守方 HP -${dmg}`;
                roundEnds = true;
            }
        }

        if (roundEnds) {
            applyHPChange(dmgP, dmgOp);
            let title = "";
            if(triggerType === 'mistake') title = "误判";
            if(triggerType === 'caught') title = "识破";
            if(triggerType === 'interval') title = "间隔";
            if(!title && state.turn === 10) title = "平局";
            addLogEntry(state.roundCount, title, dmgP, dmgOp, damageMsg);
            
            showTriggerResult(triggerType, damageMsg);
            ui.gameControls.style.display = 'none';
            ui.nextControls.style.display = 'flex';
        } else {
            state.myMove = null; state.opMove = null;
            state.turn++;
            updateUI(); renderTimeline();
        }
    }

    function applyHPChange(dp, dop) {
        state.pHP = Math.max(0, Math.min(MAX_HP, state.pHP + dp));
        state.opHP = Math.max(0, Math.min(MAX_HP, state.opHP + dop));
    }

    function prepareNewRound() {
        ui.nextControls.style.display = 'none';
        ui.msg.textContent = "等待对手确认...";
        if (state.mode === 'pve') {
            initRound();
        } else {
            state.readyForNextRound = true;
            sendData({ type: 'NEXT_ROUND' });
            checkNextRound();
        }
    }

    function checkNextRound() {
        if (state.readyForNextRound && state.opReady) initRound();
    }

    // ================= 4. 结束与重开 =================
    function endGame() {
        state.gameOver = true;
        ui.endModal.style.display = 'flex';
        const title = document.getElementById('end-title');
        const desc = document.getElementById('end-desc');
        const win = state.pHP > 0;
        title.textContent = win ? "🏆 胜利！" : "💀 失败";
        title.style.color = win ? "var(--success)" : "var(--danger)";
        desc.textContent = win ? "恭喜你击败了对手！" : "胜败乃兵家常事。";
        
        // 重置按钮文字
        ui.btnRestartModal.textContent = "🔄 再来一局";
        ui.btnRestartModal.disabled = false;
        ui.btnRestartPanel.textContent = "🔄 再来一局";
        ui.btnRestartPanel.disabled = false;
        
        // 清理重开状态
        state.restartReq = false;
        state.opRestartReq = false;
    }

    function viewBoard() {
        ui.endModal.style.display = 'none';
        // 显示游戏区下方的“再来一局/退出”按钮
        ui.gameOverControls.style.display = 'flex';
        ui.msg.textContent = "查看战绩中...";
        ui.img.style.display = 'none';
        switchTab('log');
    }

    function requestRestart() {
        ui.btnRestartModal.disabled = true;
        ui.btnRestartPanel.disabled = true;
        
        if (state.mode === 'pve') {
            restartGame();
        } else {
            state.restartReq = true;
            if (state.opRestartReq) {
                // 对方已经请求了，直接开始
                restartGame();
            } else {
                ui.btnRestartModal.textContent = "⏳ 等待对手...";
                ui.btnRestartPanel.textContent = "⏳ 等待对手...";
                ui.msg.textContent = "已发送请求，等待对手确认...";
                sendData({ type: 'RESTART_REQUEST' });
            }
        }
    }

    function restartGame() {
        state.gameOver = false;
        state.pHP = 40;
        state.opHP = 40;
        state.roundCount = 1;
        state.restartReq = false;
        state.opRestartReq = false;
        
        addLogSystemMsg("=== 新对局开始 ===");
        ui.endModal.style.display = 'none';
        ui.gameOverControls.style.display = 'none';
        
        initRound(true);
    }

    // ================= 5. UI与辅助 =================
    function consumeShield(who) {
        if (who === 'p') state.pShield = false;
        else state.opShield = false;
        updateUI();
    }

    function showTriggerResult(type, msg) {
        let imgName = '';
        if (type === 'interval') imgName = '间隔伤害';
        if (type === 'mistake') imgName = '误判';
        if (type === 'caught') imgName = '识破';
        if (imgName) {
            ui.img.src = imgName + IMG_EXT;
            ui.img.style.display = 'block';
            ui.img.classList.add('fade-in');
        }
        ui.msg.innerHTML = msg;
    }

    function updateUI() {
        ui.pHpText.textContent = `${state.pHP} / ${MAX_HP}`;
        ui.opHpText.textContent = `${state.opHP} / ${MAX_HP}`;
        ui.pHpBar.style.width = (state.pHP / MAX_HP * 100) + '%';
        ui.opHpBar.style.width = (state.opHP / MAX_HP * 100) + '%';
        
        if (state.myRole === 'atk') {
            ui.pBadge.className = 'role-badge role-atk'; ui.pBadge.textContent = '我方 (攻:丢)';
            ui.opBadge.className = 'role-badge role-def'; ui.opBadge.textContent = '对手 (守:查)';
            if (state.droppedTurn !== null) {
                ui.btnAct.style.display = 'none';
                ui.btnWait.textContent = "保持不动";
            } else {
                ui.btnAct.style.display = 'inline-block';
                ui.btnAct.textContent = "丢下";
                ui.btnWait.textContent = "持有";
            }
        } else {
            ui.pBadge.className = 'role-badge role-def'; ui.pBadge.textContent = '我方 (守:查)';
            ui.opBadge.className = 'role-badge role-atk'; ui.opBadge.textContent = '对手 (攻:丢)';
            ui.btnAct.style.display = 'inline-block';
            ui.btnAct.textContent = "回头";
            ui.btnWait.textContent = "继续走";
        }
        ui.pShield.style.display = state.pShield ? 'inline-block' : 'none';
        ui.opShield.style.display = state.opShield ? 'inline-block' : 'none';
        ui.turn.textContent = state.turn;
    }

    function renderTimeline() {
        ui.timeline.innerHTML = '';
        for (let i = 1; i <= MAX_TURNS; i++) {
            let div = document.createElement('div');
            div.className = 'time-slot';
            div.textContent = i;
            if (i === state.turn) div.classList.add('active');
            if (i < state.turn) div.classList.add('past');
            const showItem = (state.myRole === 'atk' && state.droppedTurn && i >= state.droppedTurn);
            if (showItem) div.classList.add('has-item');
            ui.timeline.appendChild(div);
        }
    }

    // ================= 6. 计分板与聊天 =================
    function addLogSystemMsg(txt) {
        if(ui.logList.children[0]?.textContent === '暂无记录') ui.logList.innerHTML = '';
        let div = document.createElement('div');
        div.style = "text-align:center; color:#64748b; font-size:0.8em; margin:10px 0; border-bottom:1px solid #334155; padding-bottom:5px;";
        div.textContent = txt;
        ui.logList.appendChild(div);
    }

    function addLogEntry(round, type, dp, dop, desc) {
        if(ui.logList.children[0]?.textContent === '暂无记录') ui.logList.innerHTML = '';
        let typeClass = '';
        if(type === '误判') typeClass = 'log-mistake';
        if(type === '识破') typeClass = 'log-caught';
        let pColor = dp >= 0 ? 'var(--success)' : 'var(--danger)';
        let opColor = dop >= 0 ? 'var(--success)' : 'var(--danger)';
        let pSign = dp > 0 ? '+' : '';
        let opSign = dop > 0 ? '+' : '';
        let html = `
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span style="font-weight:bold;">第${round}轮: ${type}</span>
                <span style="font-size:0.8em; color:#94a3b8;">(${state.myRole==='atk'?'我攻':'我守'})</span>
            </div>
            <div style="font-size:0.85em; color:#ccc; margin-bottom:5px;">${desc}</div>
            <div style="display:flex; justify-content:space-between; font-size:0.9em;">
                <span>我: <span style="color:${pColor}">${pSign}${dp}</span></span>
                <span>敌: <span style="color:${opColor}">${opSign}${dop}</span></span>
            </div>
        `;
        let div = document.createElement('div');
        div.className = 'log-entry ' + typeClass;
        div.innerHTML = html;
        ui.logList.appendChild(div);
        ui.logList.scrollTop = ui.logList.scrollHeight;
    }

    function sendChat() {
        const txt = ui.chatInput.value.trim();
        if (!txt) return;
        addChatMessage('me', txt);
        sendData({ type: 'CHAT', content: txt });
        ui.chatInput.value = '';
    }

    function sendEmoji(emoji) {
        addChatMessage('me', emoji);
        sendData({ type: 'CHAT', content: emoji });
    }

    function addChatMessage(who, text) {
        const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        let div = document.createElement('div');
        div.className = `chat-bubble chat-${who}`;
        div.innerHTML = safeText;
        ui.chatMsgs.appendChild(div);
        ui.chatMsgs.scrollTop = ui.chatMsgs.scrollHeight;
        if (!document.getElementById('tab-chat').classList.contains('active')) {
             ui.chatTabBtn.style.color = 'var(--accent)';
             setTimeout(() => ui.chatTabBtn.style.color = '#94a3b8', 1000);
        }
    }
</script>
</body>
</html>
